apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: va-job-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: docker-worker:latest
          imagePullPolicy: Never
          envFrom:
            - configMapRef:
                name: va-config
