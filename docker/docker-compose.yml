services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=va_jobs
      - REDIS_URI=redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=va_jobs
      - REDIS_URI=redis://redis:6379/0
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  mongo_data:
